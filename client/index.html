<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Manifest — Task Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0b1215;
    --panel: #121b1f;
    --panel-border: #1f2c31;
    --text: #e7edf0;
    --muted: #7c9099;
    --amber: #f5a623;
    --green: #3ddc97;
    --red: #ef5b5b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
  .mono { font-family: 'JetBrains Mono', monospace; }

  .app { max-width: 720px; margin: 0 auto; padding: 48px 24px 80px; }

  header { margin-bottom: 32px; }
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--amber);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  h1 { font-size: 28px; margin: 0 0 6px; letter-spacing: -0.01em; }
  .subtitle { color: var(--muted); font-size: 14px; margin: 0; }

  form.add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 28px;
  }
  input, select {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    color: var(--text);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
  }
  input[type="text"] { flex: 1; }
  input:focus, select:focus { outline: 2px solid var(--amber); outline-offset: -1px; }
  button {
    background: var(--amber);
    color: #1a1305;
    border: none;
    border-radius: 6px;
    padding: 10px 16px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.08); }
  button:disabled { opacity: 0.5; cursor: default; }

  .manifest-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 10px 4px;
  }

  ul.entries { list-style: none; margin: 0; padding: 0; }
  .entry {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    padding: 14px 14px;
    margin-bottom: 10px;
  }
  .entry.done { opacity: 0.55; }
  .entry-id {
    font-family: 'JetBrains Mono', monospace;
    color: var(--muted);
    font-size: 12px;
    min-width: 42px;
  }
  .entry-title { flex: 1; font-size: 14px; }
  .entry.done .entry-title { text-decoration: line-through; }

  .badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 999px;
    border: 1px solid transparent;
  }
  .badge.high { color: var(--red); border-color: rgba(239,91,91,0.4); background: rgba(239,91,91,0.08); }
  .badge.medium { color: var(--amber); border-color: rgba(245,166,35,0.4); background: rgba(245,166,35,0.08); }
  .badge.low { color: var(--muted); border-color: var(--panel-border); }

  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .status-dot.done { background: var(--green); box-shadow: 0 0 6px rgba(61,220,151,0.6); }
  .status-dot.pending { background: var(--amber); box-shadow: 0 0 6px rgba(245,166,35,0.5); }

  .entry-actions { display: flex; gap: 6px; }
  .icon-btn {
    background: transparent;
    border: 1px solid var(--panel-border);
    color: var(--muted);
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--muted); }
  .icon-btn.danger:hover { color: var(--red); border-color: var(--red); }

  .empty {
    color: var(--muted);
    font-size: 14px;
    text-align: center;
    padding: 40px 0;
    border: 1px dashed var(--panel-border);
    border-radius: 8px;
  }
  .footer-note {
    margin-top: 32px;
    font-size: 12px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
  }
  .footer-note a { color: var(--amber); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback } = React;
const API_BASE = "http://localhost:4000/api";

function App() {
  const [tasks, setTasks] = useState([]);
  const [title, setTitle] = useState("");
  const [priority, setPriority] = useState("medium");
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  const loadTasks = useCallback(async () => {
    try {
      const res = await fetch(`${API_BASE}/tasks`);
      if (!res.ok) throw new Error("Failed to load tasks");
      setTasks(await res.json());
      setError(null);
    } catch (e) {
      setError("Can't reach the API — make sure the server is running on :4000");
    } finally {
      setLoading(false);
    }
  }, []);

  useEffect(() => { loadTasks(); }, [loadTasks]);

  async function addTask(e) {
    e.preventDefault();
    if (!title.trim()) return;
    await fetch(`${API_BASE}/tasks`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ title, priority }),
    });
    setTitle("");
    loadTasks();
  }

  async function toggleStatus(task) {
    const status = task.status === "done" ? "pending" : "done";
    await fetch(`${API_BASE}/tasks/${task.id}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status }),
    });
    loadTasks();
  }

  async function removeTask(id) {
    await fetch(`${API_BASE}/tasks/${id}`, { method: "DELETE" });
    loadTasks();
  }

  return (
    <div className="app">
      <header>
        <div className="eyebrow">// task-manifest v1</div>
        <h1>Release Manifest</h1>
        <p className="subtitle">Track work like a patch log — add, ship, and roll back tasks.</p>
      </header>

      <form className="add-row" onSubmit={addTask}>
        <input
          type="text"
          placeholder="Describe the task…"
          value={title}
          onChange={(e) => setTitle(e.target.value)}
        />
        <select value={priority} onChange={(e) => setPriority(e.target.value)}>
          <option value="low">low</option>
          <option value="medium">medium</option>
          <option value="high">high</option>
        </select>
        <button type="submit" disabled={!title.trim()}>Ship it</button>
      </form>

      <p className="manifest-label">Entries — {tasks.length}</p>

      {error && <div className="empty">{error}</div>}
      {!error && loading && <div className="empty">Loading manifest…</div>}
      {!error && !loading && tasks.length === 0 && (
        <div className="empty">No entries yet. Add your first task above.</div>
      )}

      <ul className="entries">
        {tasks.map((task) => (
          <li key={task.id} className={`entry ${task.status === "done" ? "done" : ""}`}>
            <span className={`status-dot ${task.status}`} />
            <span className="entry-id mono">#{String(task.id).padStart(3, "0")}</span>
            <span className="entry-title">{task.title}</span>
            <span className={`badge ${task.priority}`}>{task.priority}</span>
            <div className="entry-actions">
              <button className="icon-btn" onClick={() => toggleStatus(task)}>
                {task.status === "done" ? "reopen" : "mark done"}
              </button>
              <button className="icon-btn danger" onClick={() => removeTask(task.id)}>delete</button>
            </div>
          </li>
        ))}
      </ul>

      <p className="footer-note">
        Backed by a REST API at <code>localhost:4000</code> — the same tasks are also reachable
        through the <code>task-manager-mcp</code> server via <code>list_tasks</code>, <code>add_task</code>,{" "}
        <code>complete_task</code>, and <code>delete_task</code> tools.
      </p>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
